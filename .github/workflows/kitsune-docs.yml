name: Kitsune Docs

# Builds website/ (Docusaurus, English only) and publishes it to GitHub Pages at
# https://kingbeam5.github.io/kitsune-agent/ . Manual trigger until the site is verified.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kitsune-docs
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'KingBeam5/kitsune-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # extract-plugins.py derives catalog dates from git history

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install site dependencies
        working-directory: website
        run: |
          python -m pip install ruamel.yaml==0.18.17 httpx==0.28.1
          npm ci

      - name: Generate skill, plugin and llms pages
        working-directory: website
        run: node scripts/prebuild.mjs

      - name: Build the site (English)
        working-directory: website
        run: npx docusaurus build --locale en

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: website/build
          retention-days: 30  # scripts/fetch-docs-site.sh downloads this artifact

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
