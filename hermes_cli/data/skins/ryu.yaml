# Ryu — default skin of Kitsune Agent. Dark orchid and electric blue on near-black.
# Bundled with the harness; a user file at <HERMES_HOME>/skins/ryu.yaml overrides it.
name: ryu
description: Ryu — Kitsune Agent default. Dark orchid and electric blue on near-black

colors:
  # --- base surface -------------------------------------------------------
  background: "#0B0B10"

  # --- brand accents ------------------------------------------------------
  # NOTE: raw Dark Orchid #9932CC is only 3.44:1 on #0B0B10 (below WCAG AA).
  # It is used for STRUCTURE (rules, borders, fills); text accents use the
  # lifted tint #B25BE0 (5.11:1) and #C27AEB (6.8:1).
  ui_accent: "#B25BE0"
  banner_accent: "#B25BE0"
  ui_label: "#C27AEB"
  input_rule: "#9932CC"
  response_border: "#9932CC"

  # --- text hierarchy -----------------------------------------------------
  banner_title: "#E8E4F0"
  ui_primary: "#E8E4F0"
  banner_text: "#D8D8E0"
  ui_text: "#D8D8E0"
  prompt: "#D8D8E0"
  banner_dim: "#8A8AA0"
  ui_thinking: "#8A8AA0"
  banner_border: "#2A2340"
  ui_border: "#2A2340"

  # --- technical / secondary indicators (electric blue) -------------------
  ui_tool: "#398BFF"
  shell_dollar: "#398BFF"

  # --- semantic status ----------------------------------------------------
  ui_ok: "#3FD69A"
  ui_warn: "#E0A33F"
  ui_error: "#FF6B81"

  # --- status bar ---------------------------------------------------------
  status_bar_bg: "#14111F"
  status_bar_text: "#C9C9D6"
  status_bar_strong: "#B25BE0"
  status_bar_dim: "#74748C"
  status_bar_good: "#3FD69A"
  status_bar_warn: "#E0A33F"
  status_bar_bad: "#FF9B4A"
  status_bar_critical: "#FF6B81"
  session_label: "#C27AEB"
  session_border: "#3A3356"

  # --- menus / selection --------------------------------------------------
  completion_menu_bg: "#14111F"
  completion_menu_current_bg: "#3A1D56"
  completion_menu_meta_bg: "#100E1A"
  completion_menu_meta_current_bg: "#2A1540"
  selection_bg: "#3A1D56"
  voice_status_bg: "#14111F"

  # --- diffs --------------------------------------------------------------
  diff_added: "#4ADE9B"
  diff_removed: "#FF7A90"
  diff_added_word: "#8FF0C4"
  diff_removed_word: "#FFA8B6"

  # --- code syntax --------------------------------------------------------
  syntax_string: "#7FD1C4"
  syntax_number: "#398BFF"
  syntax_keyword: "#B25BE0"
  syntax_comment: "#5E5E78"

spinner:
  waiting_faces: ["(◈)", "(◇)", "(◢)", "(◣)", "(⌁)"]
  thinking_faces: ["(◈)", "(⌁)", "(◇)", "(◆)", "(✶)"]
  thinking_verbs:
    - tracing the lattice
    - reading the grid
    - aligning the mask
    - threading circuits
    - sharpening focus
    - mapping the path
    - settling the pattern
    - holding the line
  wings:
    - ["⟪◈", "◈⟫"]
    - ["⟪⌁", "⌁⟫"]
    - ["⟪◇", "◇⟫"]
    - ["⟪╸", "╺⟫"]

branding:
  agent_name: Ryu
  welcome: "Ryu online. Type your message or /help for commands."
  goodbye: "Signing off. ◈"
  response_label: " ◈ Ryu "
  prompt_symbol: "❯"
  help_header: "(◈) Available Commands"

tool_prefix: "│"

